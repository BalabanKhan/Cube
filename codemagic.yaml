workflows:
  cubism-release-workflow:
    name: Cubism Production Build
    max_build_duration: 120
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          fetch-signing-files
          xcode-project use-profiles
      - name: Build Android AppBundle
        script: flutter build appbundle --release
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build iOS IPA
        script: flutter build ipa --release --export-options-plist=$CM_EXPORT_DIR/ExportOptions.plist
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect: Codemagic Admin API Key
